<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GSB Field Ops</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512x512.png">
<link rel="apple-touch-icon" href="./icon-192x192.png">
<meta name="theme-color" content="#7A6A45">


<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GSB Field Ops">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --brown:#7A6A45;
  --brown-dark:#5C4F33;
  --brown-light:#EFEADD;
  --white:#FFFFFF;
  --ink:#2A261E;
  --muted:#8A8371;
  --line:#E4DFD0;
  --warn:#B23A2E;
  --good:#3F7D4F;
  --amber:#B8863A;
  --bg:#FBFAF7;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
.disp{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}

/* ---------- LOGIN ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--brown);padding:20px;}
.login-card{background:var(--white);border-radius:12px;padding:36px 34px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.25);}
.login-logo{width:150px;display:block;margin:0 auto 6px;}
.login-title{text-align:center;font-family:'Oswald',sans-serif;font-size:15px;color:var(--brown-dark);letter-spacing:0.05em;margin-bottom:22px;}
.login-card .field{margin-bottom:12px;}
.login-card label{display:block;font-size:11px;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);margin-bottom:5px;}
.login-card input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:6px;font-size:15px;}
.login-btn{width:100%;padding:12px;background:var(--brown);color:#fff;border:none;border-radius:6px;font-family:'Oswald',sans-serif;
  text-transform:uppercase;letter-spacing:0.05em;font-size:13px;cursor:pointer;margin-top:6px;}
.login-btn:hover{background:var(--brown-dark);}
.demo-hint{margin-top:20px;background:var(--brown-light);border-radius:8px;padding:12px 14px;font-size:11.5px;color:var(--brown-dark);line-height:1.7;}
.demo-hint b{font-family:'IBM Plex Mono',monospace;}
.login-err{color:var(--warn);font-size:12.5px;margin-top:8px;text-align:center;}

/* ---------- SHELL ---------- */
.topbar{
  background:var(--brown);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:4px solid var(--brown-dark);flex-wrap:wrap;gap:10px;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand img{height:40px;}
.brand-text .t1{font-family:'Oswald',sans-serif;font-weight:700;font-size:17px;letter-spacing:0.03em;}
.brand-text .t2{font-size:10.5px;color:#E7E1CF;font-family:'IBM Plex Mono',monospace;}
.nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
.nav button{
  background:transparent;border:1px solid rgba(255,255,255,0.3);color:#fff;
  padding:8px 13px;border-radius:5px;font-family:'Oswald',sans-serif;font-size:12px;
  letter-spacing:0.03em;text-transform:uppercase;cursor:pointer;
}
.nav button.active{background:#fff;color:var(--brown-dark);border-color:#fff;}
.user-chip{display:flex;align-items:center;gap:10px;}
.role-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;background:rgba(255,255,255,0.18);padding:3px 9px;border-radius:20px;text-transform:uppercase;}
.bell{position:relative;cursor:pointer;width:20px;height:20px;color:#fff;}
.bell-dot{position:absolute;top:-4px;right:-4px;background:var(--warn);color:#fff;font-size:9px;border-radius:50%;
  width:15px;height:15px;display:flex;align-items:center;justify-content:center;font-weight:700;}
.logout-btn{background:transparent;border:1px solid rgba(255,255,255,0.4);color:#fff;border-radius:5px;padding:6px 10px;font-size:11px;cursor:pointer;}

.wrap{max-width:1100px;margin:0 auto;padding:28px 24px 60px;}
h1.page-title{font-family:'Oswald',sans-serif;font-size:25px;margin:0 0 4px;letter-spacing:0.02em;}
.subtle{color:var(--muted);font-size:13.5px;margin-bottom:20px;}

/* HOME */
.home-hero{text-align:center;padding:20px 0 8px;}
.home-hero img{height:100px;margin-bottom:6px;}
.home-hero .name{font-family:'Oswald',sans-serif;font-size:22px;color:var(--brown-dark);letter-spacing:0.03em;}
.home-hero .tag{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:26px;}
.home-card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:20px;cursor:pointer;position:relative;
  transition:transform .15s,box-shadow .15s;overflow:hidden;}
.home-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(122,106,69,0.18);}
.home-card::before{content:"";position:absolute;top:0;left:0;width:5px;height:100%;background:var(--brown);}
.home-card .ic{width:32px;height:32px;color:var(--brown);margin-bottom:10px;}
.home-card h3{font-family:'Oswald',sans-serif;font-size:15px;margin:0 0 5px;letter-spacing:0.02em;}
.home-card p{font-size:12px;color:var(--muted);margin:0;line-height:1.4;}
.home-badge{position:absolute;top:12px;right:12px;background:var(--warn);color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 8px;font-family:'IBM Plex Mono',monospace;}

.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.btn{background:var(--brown);color:#fff;border:none;padding:10px 16px;border-radius:6px;cursor:pointer;font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:0.03em;text-transform:uppercase;}
.btn:hover{background:var(--brown-dark);}
.btn.ghost{background:transparent;color:var(--brown-dark);border:1px solid var(--line);}
.btn.small{padding:6px 11px;font-size:11px;}
.btn.warn{background:var(--warn);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}

.subtabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:2px solid var(--line);flex-wrap:wrap;}
.subtabs button{background:transparent;border:none;padding:9px 4px;margin-right:18px;font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:0.03em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;position:relative;top:2px;}
.subtabs button.active{color:var(--brown-dark);border-bottom-color:var(--brown);}

.card{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:14px;}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px;}
.list-row:last-child{border-bottom:none;}
.list-row .main b{font-size:14.5px;}
.list-row .main .meta{font-size:12px;color:var(--muted);margin-top:2px;}
.tag{display:inline-block;font-size:10.5px;font-family:'IBM Plex Mono',monospace;padding:2px 8px;border-radius:20px;font-weight:600;}
.tag.pending{background:#F5E9D4;color:var(--amber);}
.tag.reviewed,.tag.ok{background:#DCEADD;color:var(--good);}
.tag.overdue{background:#F3DAD6;color:var(--warn);}
.tag.category{background:var(--brown-light);color:var(--brown-dark);}
.tag.locked{background:#E4DFD0;color:var(--ink);}

.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty svg{width:38px;height:38px;margin-bottom:10px;opacity:0.4;}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;font-family:'Oswald',sans-serif;letter-spacing:0.03em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:5px;font-family:'Inter',sans-serif;font-size:14px;background:#fff;color:var(--ink);}
.field textarea{resize:vertical;min-height:60px;}
.checklist{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:6px 0;}
.chk input{width:16px;height:16px;}
.section-label{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:0.03em;text-transform:uppercase;color:var(--brown-dark);margin:22px 0 10px;border-bottom:2px solid var(--line);padding-bottom:6px;}
.section-label:first-child{margin-top:0;}

.detail-panel{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:22px;margin-top:6px;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-bottom:6px;}
.dg-item .k{font-size:10.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;}
.dg-item .v{font-size:14px;margin-top:2px;}
.dg-item .v.blur{filter:blur(6px);user-select:none;}
.notes-block{white-space:pre-wrap;font-size:13.5px;line-height:1.5;background:var(--brown-light);border:1px solid var(--line);border-radius:6px;padding:12px;}

/* lock banner */
.lock-banner{display:flex;align-items:center;gap:10px;border-radius:7px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;}
.lock-banner.editable{background:#FDF3E3;color:var(--amber);border:1px solid #EAD6A8;}
.lock-banner.locked{background:#EFEBE0;color:var(--ink);border:1px solid var(--line);}

/* progress bar */
.progress-wrap{margin:14px 0 6px;}
.progress-track{display:flex;height:9px;border-radius:20px;overflow:hidden;background:var(--line);}
.progress-seg{flex:1;background:var(--line);border-right:2px solid #fff;}
.progress-seg.on{background:var(--good);}
.progress-seg.partial{background:var(--amber);}
.progress-labels{display:flex;font-size:9.5px;color:var(--muted);margin-top:5px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;}
.progress-labels span{flex:1;text-align:center;}
.stage-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

.timer-box{border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;align-items:center;gap:14px;background:var(--brown-light);margin-top:8px;}
.timer-box.due{background:#F8ECE9;border-color:#E3C3BC;}
.timer-num{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;}
.timer-num.due{color:var(--warn);}

.close-x{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;}
.modal-overlay{position:fixed;inset:0;background:rgba(42,38,30,0.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
.modal{background:var(--bg);border-radius:10px;max-width:820px;width:100%;padding:26px 28px;margin-bottom:60px;}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}

.legal-block{font-size:12px;color:var(--ink);line-height:1.6;background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px 16px;max-height:220px;overflow-y:auto;margin-bottom:14px;}
.legal-block h4{font-family:'Oswald',sans-serif;font-size:12px;margin:12px 0 4px;text-transform:uppercase;color:var(--brown-dark);}
.legal-block h4:first-child{margin-top:0;}
.legal-block ul{margin:4px 0;padding-left:18px;}

.sig-pad-wrap{border:1.5px dashed var(--line);border-radius:8px;background:#fff;position:relative;}
canvas.sig-pad{width:100%;height:140px;display:block;touch-action:none;cursor:crosshair;}
.sig-hint{position:absolute;bottom:8px;left:12px;font-size:11px;color:var(--muted);pointer-events:none;}

.notif-panel{position:absolute;top:56px;right:24px;background:#fff;border:1px solid var(--line);border-radius:8px;width:320px;
  box-shadow:0 12px 30px rgba(0,0,0,0.15);z-index:60;max-height:400px;overflow-y:auto;}
.notif-item{padding:12px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink);}
.notif-item .t{font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:3px;}

table.hist{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
table.hist th{text-align:left;font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:0.03em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--line);padding:6px 6px;}
table.hist td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
.loading{padding:60px;text-align:center;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:13px;}
.boot-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--brown);color:#fff;padding:20px;text-align:center;}
.boot-screen .name{font-family:'Oswald',sans-serif;font-size:20px;letter-spacing:0.03em;margin-top:14px;}
.boot-spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,0.25);border-top-color:#fff;border-radius:50%;animation:boot-spin 0.8s linear infinite;margin-bottom:6px;}
@keyframes boot-spin{to{transform:rotate(360deg);}}
#boot-status{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#E7E1CF;margin-top:12px;min-height:16px;}
.banner-note{background:var(--brown-light);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--brown-dark);margin-bottom:18px;}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:12px;}
.photo-card{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;}
.photo-card img{width:100%;height:120px;object-fit:cover;display:block;background:#eee;}
.photo-card .cap-wrap{padding:8px;}
.photo-card input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:5px;font-size:12px;}
.photo-card .rm{width:100%;background:transparent;border:none;color:var(--warn);font-size:11px;padding:4px 8px 0;cursor:pointer;text-align:right;}
.add-photo-btn{border:1.5px dashed var(--line);border-radius:8px;background:#fff;color:var(--brown-dark);padding:14px;width:100%;
  font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:0.03em;text-transform:uppercase;cursor:pointer;text-align:center;}
/* vendor ranking */
.vrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.star-widget{display:inline-flex;gap:2px;cursor:pointer;}
.star-widget .star{font-size:16px;color:var(--line);}
.star-widget .star.on{color:var(--brown);}
.icon-btn{background:transparent;border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:11px;cursor:pointer;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.icon-btn.on.fav{background:#FCE9C6;border-color:#E9C77E;color:#8A6412;}
.icon-btn.on.trust{background:#DCEADD;border-color:#B9DABB;color:var(--good);}
.reliability{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.reliability button{border:none;background:transparent;color:var(--good);cursor:pointer;font-size:11px;padding:0 3px;}
.reliability button.late{color:var(--warn);}
/* projects tab */
.project-card{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:12px;}
.project-card .pname{font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:0.01em;}
.project-card .pname input{font-family:'Inter',sans-serif;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;}
.client-chip{font-size:11px;color:var(--brown-dark);background:var(--brown-light);border-radius:20px;padding:2px 10px;font-family:'IBM Plex Mono',monospace;}
/* team */
.team-row{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);}
.team-row:last-child{border-bottom:none;}
.code-pill{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--brown-light);color:var(--brown-dark);padding:3px 10px;border-radius:20px;}
/* reviews QR */
.clock-card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:26px;text-align:center;max-width:420px;margin:0 auto 24px;}
.clock-big{font-family:'IBM Plex Mono',monospace;font-size:28px;color:var(--brown-dark);margin:10px 0;}
.shift-row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13px;}
.shift-row:last-child{border-bottom:none;}
.employee-card{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:12px;cursor:pointer;}
.employee-card:hover{box-shadow:0 6px 16px rgba(122,106,69,0.12);}
.qr-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:30px;text-align:center;max-width:380px;margin:20px auto;}
.qr-box img{width:220px;height:220px;}
/* floor plan sketch */
.sketch-overlay{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;}
.sketch-toolbar-row{background:var(--brown);color:#fff;padding:8px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sketch-toolbar-row.row2{background:var(--brown-dark);padding:6px 14px;}
.sketch-toolbar .grp, .sketch-toolbar-row .grp{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.1);padding:4px 7px;border-radius:6px;}
.sketch-tool-btn{background:transparent;border:1px solid rgba(255,255,255,0.35);color:#fff;padding:6px 10px;border-radius:5px;font-family:'Oswald',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:0.03em;cursor:pointer;white-space:nowrap;}
.sketch-tool-btn.active{background:#fff;color:var(--brown-dark);border-color:#fff;}
.sketch-tool-btn.small{padding:5px 8px;font-size:10px;}
.sketch-tool-btn:disabled{opacity:0.35;cursor:not-allowed;}
.sketch-color-dot{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,0.6);cursor:pointer;flex-shrink:0;}
.sketch-color-dot.active{border-color:#fff;box-shadow:0 0 0 2px var(--brown);}
.sketch-canvas-wrap{flex:1;overflow:auto;background:#EFEADD;display:flex;align-items:flex-start;justify-content:center;padding:20px;touch-action:none;}
canvas.sketch-canvas{background:#fff;box-shadow:0 4px 16px rgba(0,0,0,0.15);touch-action:none;}
.sketch-footer{background:var(--white);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.sketch-calib-banner{background:#FDF3E3;color:var(--amber);border:1px solid #EAD6A8;border-radius:6px;padding:8px 12px;font-size:12px;}
.sketch-stat-pill{background:rgba(255,255,255,0.18);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:6px 10px;border-radius:20px;white-space:nowrap;}
</style>
</head>
<body>
<div id="app"><div class="boot-screen"><div class="boot-spinner"></div><div class="name">GSB Field Ops</div><div id="boot-status">Starting up…</div></div></div>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script>
window.onerror = function(msg, src, line, col, err){
  const app = document.getElementById('app');
  if(app && !app.dataset.rendered){
    app.innerHTML = '<div class="loading">Something went wrong loading the app.<br><span class="mono" style="font-size:11px;">'+
      String(msg).replace(/&/g,'&amp;').replace(/</g,'&lt;')+' (line '+line+')</span><br><br>'+
      '<span style="font-size:12px;">Try reloading the page. If this keeps happening, tell Claude the exact message above.</span></div>';
  }
  return false;
};
</script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDliaddiPS8dBaDg9nQQwEwo491SF5SE1k",
  authDomain: "gsb-app-80aec.firebaseapp.com",
  projectId: "gsb-app-80aec",
  storageBucket: "gsb-app-80aec.firebasestorage.app",
  messagingSenderId: "737340839294",
  appId: "1:737340839294:web:d8d846e5ba58d4ed898f2f"
};
let fbAuth, fbDb;
if(typeof firebase === 'undefined'){
  document.getElementById('app').innerHTML = '<div class="loading">Could not load the Firebase library — check your internet connection, then reload this page.</div>';
} else {
  firebase.initializeApp(firebaseConfig);
  fbAuth = firebase.auth();
  fbDb = firebase.firestore();
  fbDb.enablePersistence({synchronizeTabs:true}).catch(err=>{
    console.warn('Offline persistence not enabled:', err.code); // e.g. multiple tabs open in an unsupported way — app still works online

  { id: 'contract-page-1', label: 'Construction Contract — Page 1', content: `## 1. Parties & Project Information

  { id: 'contract-page-2', label: 'Construction Contract — Page 2', content: `## 3. Contract Price & Payment Schedule

  { id: 'contract-page-3', label: 'Construction Contract — Page 3', content: `## 7. General Conditions

  { id: 'contract-page-4', label: 'Construction Contract — Page 4', content: `## 14. Limitation of Liability

  { id: 'sub-agreement', label: 'Subcontractor Agreement', content: `This Subcontractor Agreement ("Agreement") is entered into as of the date below, between GSB General Construction Inc, a Florida licensed general contractor ("GSB" or "Contractor"), and the subcontractor identified below ("Subcontractor"). This Agreement governs all work Subcontractor performs for GSB unless a specific Work Order states otherwise.

## 1. Scope of Work

Subcontractor agrees to perform the work described in the applicable Work Order, Scope Sheet, or Purchase Order issued by GSB for the project located at the address stated in that Work Order ("Project"). Each Work Order is incorporated into this Agreement by reference.

## 2. Scheduling Commitments & No-Show Policy

- a. Confirmed Appointments Are Binding. Once GSB and Subcontractor confirm a date and time for Subcontractor to be on-site, that commitment is treated as scheduled labor GSB is relying on — not a rough estimate.
- b. Notice of Delay or Cancellation. If Subcontractor cannot make a confirmed appointment, Subcontractor must notify GSB by phone or text no later than two (2) hours before the scheduled time.
- c. Missed Appointment Defined. A "missed appointment" means Subcontractor fails to arrive within thirty (30) minutes of the confirmed time without providing the notice described in (b).
- d. First Missed Appointment. GSB will issue written notice to Subcontractor documenting the missed appointment.
- e. Backcharge for Wasted Time. For any missed appointment, GSB may invoice Subcontractor for documented direct costs resulting from it, including idle crew labor, rescheduled trip charges, and project delay costs directly attributable to the missed appointment, supported by reasonable documentation such as timesheets or mileage logs.
- f. Second Missed Appointment (Rolling 12 Months). GSB may, at its sole discretion, terminate this Agreement immediately and remove Subcontractor from GSB's approved subcontractor list, in addition to any backcharge under (e).
- g. This section does not limit any other remedy available to GSB under this Agreement or Florida law.

## 3. Compensation & Payment Terms

Subcontractor shall be paid the price set forth in the applicable Work Order. Unless otherwise stated in that Work Order, payment is due within fifteen (15) days of GSB's receipt of a complete, accurate invoice and GSB's acceptance of the completed work.

## 4. Independent Contractor Status

Subcontractor is an independent contractor, not an employee, agent, or partner of GSB. Subcontractor is solely responsible for its own taxes, insurance, tools, and employees or crew.

## 5. Licensing & Insurance

Subcontractor represents that it holds all licenses required by Florida law and applicable local jurisdictions for its trade, and shall maintain general liability insurance and workers' compensation coverage as required by law, providing certificates of insurance upon request.

## 6. Quality of Work & Corrections

Work shall be performed in a professional, workmanlike manner in compliance with applicable building codes and manufacturer specifications. Subcontractor shall promptly correct, at no additional cost, any defective work identified by GSB or the property owner that is attributable to Subcontractor's work.

## 7. Change Orders

Any change to the agreed scope of work must be approved in writing (including by text or email) by GSB before Subcontractor performs the additional work. GSB is not obligated to pay for unauthorized changes.

## 8. Site Conduct & Safety

Subcontractor shall comply with GSB's job site safety requirements, maintain a clean and safe work area, and treat property owners, GSB staff, and other trades on-site professionally and respectfully.

## 9. Confidentiality

Subcontractor shall not disclose GSB's pricing, client information, business processes, proprietary tools or software, or other confidential business information to any third party, and shall not use such information to develop a competing product, service, or business.

## 10. Indemnification

Subcontractor shall indemnify and hold GSB harmless from claims, damages, or losses arising from Subcontractor's negligent acts, errors, or omissions in performing the work under this Agreement.

## 11. Termination

Either party may terminate this Agreement for convenience with fourteen (14) days' written notice, or immediately for material breach, including violations of Section 2.

## 12. Dispute Resolution & Governing Law

The parties will attempt good-faith negotiation before pursuing formal action. This Agreement is governed by the laws of the State of Florida, with venue in Broward County, Florida.

## 13. Entire Agreement

This Agreement, together with any Work Orders issued under it, constitutes the entire agreement between the parties regarding its subject matter, and supersedes any prior discussions or agreements. It may be amended only in writing signed by both parties.` },

async function migrateLegacyBlobStorage(){
  const keyList = Object.keys(KEYS);
  for(const k of keyList){
    if(DB[k].length > 0) continue; // already have real data in the new location, nothing to migrate
    try{
      const legacyDoc = await fbDb.collection('gsb-data').doc(KEYS[k]).get();
      if(legacyDoc.exists && legacyDoc.data().value){
        const legacyArray = JSON.parse(legacyDoc.data().value);
        if(Array.isArray(legacyArray) && legacyArray.length > 0){
          DB[k] = legacyArray;
          await save(k);
        }
      }
    }catch(e){ console.warn('Legacy migration check failed for', k, e); }
  }
}
// Patches records saved by earlier versions of this app so new fields/permissions never crash or silently disappear.
async function migrateData(){
  let rolesChanged = false;

    // into the two new, more specific permissions before filling in any other new fields.
    if('manageCodes' in r.perms){
      if(!('manageTeam' in r.perms)) r.perms.manageTeam = !!r.perms.manageCodes;
      if(!('manageRoles' in r.perms)) r.perms.manageRoles = !!r.perms.manageCodes;
      delete r.perms.manageCodes;
      rolesChanged = true;
    }
    const fallback = DEFAULT_ROLES.find(d=>d.key===r.key) || DEFAULT_ROLES[1]; // office-level as a safe middle default for unknown custom roles
    PERM_FIELDS.forEach(f=>{
      if(f.type==='bool' && !(f.key in r.perms)){ r.perms[f.key] = !!fallback.perms[f.key]; rolesChanged = true; }
    });
  });
  if(rolesChanged) await save('roles');

  let vendorsChanged = false;
  DB.vendors.forEach(v=>{
    if(!v.type){ v.type='vendor'; vendorsChanged = true; }
    if(!v.subAgreement){ v.subAgreement = {signed:false, signature:null, signedAt:null}; vendorsChanged = true; }
    if(!v.vendorAgreement){ v.vendorAgreement = {signed:false, signature:null, signedAt:null}; vendorsChanged = true; }
  });
  if(vendorsChanged) await save('vendors');

  let clientsChanged = false;
  DB.clients.forEach(c=>{
    (c.projects||[]).forEach(pr=>{
      if(pr.projectName===undefined){ pr.projectName=''; clientsChanged = true; }
      if(!pr.permits){ pr.permits=[]; clientsChanged = true; }
      if(!pr.inspections){ pr.inspections=[]; clientsChanged = true; }
      if(!pr.warrantyNotes){ pr.warrantyNotes=[]; clientsChanged = true; }
      if(!pr.beforePhotos){ pr.beforePhotos=[]; clientsChanged = true; }
      if(!pr.afterPhotos){ pr.afterPhotos=[]; clientsChanged = true; }
    });
  });
  if(clientsChanged) await save('clients');

  let onsiteChanged = false;
  DB.onsite.forEach(f=>{
    if(!f.photos){ f.photos=[]; onsiteChanged = true; }
    if(f.floorPlan===undefined){ f.floorPlan=null; onsiteChanged = true; }
    if(f.beforePhotos===undefined){ f.beforePhotos=[]; onsiteChanged = true; }
    if(f.pricingBreakdown===undefined){ f.pricingBreakdown=null; onsiteChanged = true; }
    if(f.archived===undefined){ f.archived=false; onsiteChanged = true; }
  });
  if(onsiteChanged) await save('onsite');

  let contractsChanged = false;
  DB.contracts.forEach(c=>{
    if(!c.pageInitials){ c.pageInitials={}; contractsChanged = true; }
    if(c.sentRemote===undefined){ c.sentRemote=false; c.sentRemoteAt=null; contractsChanged = true; }
    if(c.remoteSignToken===undefined){ c.remoteSignToken=null; c.contentHashAtSend=null; contractsChanged = true; }
    if(c.archived===undefined){ c.archived=false; contractsChanged = true; }
  });
  if(contractsChanged) await save('contracts');

  let estimatesChanged = false;
  DB.estimates.forEach(e=>{
    if(e.sentRemote===undefined){ e.sentRemote=false; e.sentRemoteAt=null; estimatesChanged = true; }
    if(e.remoteSignToken===undefined){ e.remoteSignToken=null; e.contentHashAtSend=null; estimatesChanged = true; }
    if(e.archived===undefined){ e.archived=false; estimatesChanged = true; }
  });
  if(estimatesChanged) await save('estimates');

  let calendarChanged = false;
  DB.calendarEvents.forEach(e=>{
    if(e.assignedTo===undefined){ e.assignedTo=''; e.assignedToName=''; calendarChanged = true; }
    if(e.done===undefined){ e.done=false; e.doneAt=null; calendarChanged = true; }
  });
  if(calendarChanged) await save('calendarEvents');

  let legalSettingsChanged = false;
  DB.legalDocSettings.forEach(s=>{
    if(s.mode==='pdf' && s.fileType===undefined){ s.fileType='pdf'; legalSettingsChanged = true; } // only PDFs were possible before this update
  });
  if(legalSettingsChanged) await save('legalDocSettings');
}
async function saveRecord(k, record){
  const idField = RECORD_ID_FIELD[k];
  const id = record[idField];
  if(id===undefined || id===null || id===''){ console.error('saveRecord: missing id field for', k, record); return; }
  try{ await collectionFor(k).doc(String(id)).set(record); }
  catch(e){ console.error('saveRecord failed for', k, id, e); }
}
async function deleteRecord(k, id){
  try{ await collectionFor(k).doc(String(id)).delete(); }
  catch(e){ console.error('deleteRecord failed for', k, id, e); }
}
// Bulk save every record currently in DB[k] as its own document — used for first-run seeding and one-time migrations, not regular UI edits.
async function save(k){
  const idField = RECORD_ID_FIELD[k];
  try{ await Promise.all(DB[k].map(record => collectionFor(k).doc(String(record[idField])).set(record))); }
  catch(e){ console.error('Bulk save failed for', k, e); }
}
async function saveAll(){ for(const k of Object.keys(KEYS)) await save(k); }

function initSignaturePad(canvasId){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * ratio; canvas.height = canvas.clientHeight * ratio;
  const ctx = canvas.getContext('2d'); ctx.scale(ratio, ratio);
  ctx.strokeStyle = '#2A261E'; ctx.lineWidth = 2.2; ctx.lineJoin='round'; ctx.lineCap='round';
  let drawing=false, last=null;
  function pos(e){ const r=canvas.getBoundingClientRect(); const p = e.touches? e.touches[0]:e; return {x:p.clientX-r.left, y:p.clientY-r.top}; }
  function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; e.preventDefault(); }
  function end(){ drawing=false; }
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start); canvas.addEventListener('touchmove', move); canvas.addEventListener('touchend', end);
  canvas._ctx = ctx;
}
function clearSignature(canvasId){
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
}
function getSignatureDataUrl(canvasId){ return document.getElementById(canvasId).toDataURL('image/png'); }

function sketchPointerPos(e, canvas){
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const s = STATE.sketchEditor;
  return { x: (clientX - rect.left) / s.zoom, y: (clientY - rect.top) / s.zoom };
}
function snapToGrid(v){ return Math.round(v / SKETCH_GRID_SIZE) * SKETCH_GRID_SIZE; }
function snapAngle(x1,y1,x2,y2){
  const dx = x2-x1, dy = y2-y1;
  const dist = Math.sqrt(dx*dx+dy*dy);
  let angle = Math.atan2(dy,dx);
  const step = Math.PI/12; // snap to 15-degree increments
  angle = Math.round(angle/step)*step;
  return { x: x1 + Math.cos(angle)*dist, y: y1 + Math.sin(angle)*dist };
}
function pointToSegmentDist(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1;
  const lenSq = dx*dx+dy*dy;
  let t = lenSq===0?0:((px-x1)*dx+(py-y1)*dy)/lenSq;
  t = Math.max(0, Math.min(1,t));
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}
function findLineNear(x,y){
  const s = STATE.sketchEditor;
  for(let i=s.strokes.length-1;i>=0;i--){
    const st = s.strokes[i];
    if(st.type!=='line') continue;
    if(pointToSegmentDist(x,y, st.x1,st.y1,st.x2,st.y2) < 10) return st;
  }
  return null;
}
function findTextNear(x,y){
  const s = STATE.sketchEditor;
  for(let i=s.strokes.length-1;i>=0;i--){
    const st = s.strokes[i];
    if(st.type!=='text') continue;
    if(Math.hypot(st.x-x, st.y-y) < 40) return st;
  }
  return null;
}
function findNearestEndpoint(x, y, threshold){
  const s = STATE.sketchEditor;
  let best = null, bestDist = threshold;
  s.strokes.forEach(st=>{
    if(st.type!=='line') return;
    [{x:st.x1,y:st.y1},{x:st.x2,y:st.y2}].forEach(pt=>{
      const d = Math.hypot(pt.x-x, pt.y-y);
      if(d < bestDist){ bestDist = d; best = pt; }
    });
  });
  return best;
}
function resolveSnapPoint(x, y){

}
/* ---- room detection geometry ---- */
function nodeKeyStr(x,y){ return x+','+y; }
function nodeKeyToPoint(k){ const [x,y] = k.split(',').map(Number); return {x,y}; }
function segmentIntersection(x1,y1,x2,y2,x3,y3,x4,y4){
  const d1x=x2-x1, d1y=y2-y1, d2x=x4-x3, d2y=y4-y3;
  const denom = d1x*d2y - d1y*d2x;
  if(Math.abs(denom) < 1e-9) return null;
  const t = ((x3-x1)*d2y - (y3-y1)*d2x) / denom;
  const u = ((x3-x1)*d1y - (y3-y1)*d1x) / denom;
  if(t>0.001 && t<0.999 && u>0.001 && u<0.999) return { x: x1+t*d1x, y: y1+t*d1y };
  return null;
}
function paramAlongLine(l, pt){
  const dx=l.x2-l.x1, dy=l.y2-l.y1;
  const lenSq = dx*dx+dy*dy;
  return lenSq===0 ? 0 : ((pt.x-l.x1)*dx + (pt.y-l.y1)*dy)/lenSq;
}
function pointOnSegmentT(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1;
  const lenSq = dx*dx+dy*dy;
  if(lenSq===0) return null;
  const t = ((px-x1)*dx+(py-y1)*dy)/lenSq;
  if(t<0.001 || t>0.999) return null; // excludes the segment's own endpoints — those are already handled naturally
  const projX = x1+t*dx, projY=y1+t*dy;
  if(Math.hypot(px-projX, py-projY) > 1.5) return null;
  return t;
}
function buildLineGraph(lines){
  // Splits lines wherever they cross OR touch another line mid-span (T-junctions, not just X-crossings),
  // so a box divided by walls running through the middle correctly detects as multiple rooms.
  const linePoints = {};
  lines.forEach(l=>{ linePoints[l.id] = [{x:l.x1,y:l.y1,t:0}, {x:l.x2,y:l.y2,t:1}]; });
  for(let i=0;i<lines.length;i++){
    for(let j=i+1;j<lines.length;j++){
      const a=lines[i], b=lines[j];
      const pt = segmentIntersection(a.x1,a.y1,a.x2,a.y2, b.x1,b.y1,b.x2,b.y2);
      if(pt){
        const rx = Math.round(pt.x), ry = Math.round(pt.y);
        linePoints[a.id].push({x:rx, y:ry, t:paramAlongLine(a,{x:rx,y:ry})});
        linePoints[b.id].push({x:rx, y:ry, t:paramAlongLine(b,{x:rx,y:ry})});
      }
      [[a.x1,a.y1],[a.x2,a.y2]].forEach(([px,py])=>{
        const t = pointOnSegmentT(px,py, b.x1,b.y1,b.x2,b.y2);
        if(t!=null) linePoints[b.id].push({x:Math.round(px), y:Math.round(py), t});
      });
      [[b.x1,b.y1],[b.x2,b.y2]].forEach(([px,py])=>{
        const t = pointOnSegmentT(px,py, a.x1,a.y1,a.x2,a.y2);

    const pts = linePoints[l.id].sort((p1,p2)=>p1.t-p2.t);
    for(let k=0;k<pts.length-1;k++){
      const k1 = nodeKeyStr(pts[k].x, pts[k].y), k2 = nodeKeyStr(pts[k+1].x, pts[k+1].y);

      const edgeId = uid();
      if(!adjacency[k1]) adjacency[k1]=[];
      if(!adjacency[k2]) adjacency[k2]=[];
      adjacency[k1].push({toKey:k2, edgeId});

function findShortestCycleForEdge(edge, adjacency){
  const startKey = edge.k1, endKey = edge.k2;

    const [curKey, pathKeys, pathEdgeIds] = queue.shift();
    if(curKey===endKey && pathEdgeIds.length>0){
      return { nodeKeys: pathKeys };
    }
    const neighbors = adjacency[curKey] || [];
    for(const nb of neighbors){
      if(nb.edgeId===edge.id) continue;
      if(pathEdgeIds.includes(nb.edgeId)) continue;
      if(visited.has(nb.toKey) && nb.toKey!==endKey) continue;
      visited.add(nb.toKey);
      queue.push([nb.toKey, [...pathKeys, nb.toKey], [...pathEdgeIds, nb.edgeId]]);

  edges.forEach(edge=>{
    const cycle = findShortestCycleForEdge(edge, adjacency);
    if(cycle && cycle.nodeKeys.length>=3){
      const key = [...new Set(cycle.nodeKeys)].sort().join(',');
      if(!foundByKey[key]) foundByKey[key] = cycle;
    }

  const newRooms = [];
  Object.values(foundByKey).forEach(cycle=>{
    const key = [...new Set(cycle.nodeKeys)].sort().join(',');
    const existing = (s.rooms||[]).find(r => [...new Set(r.nodeKeys)].sort().join(',') === key);

function chainLinesToPolygon(lineIds, strokes){
  const lines = lineIds.map(id=>strokes.find(st=>st.id===id)).filter(Boolean);

  let safety = 0;
  while(used.size < lines.length && safety++ < lines.length+2){
    const lastKey = path[path.length-1];
    const next = lines.find(l=> !used.has(l.id) && (nodeKeyStr(l.x1,l.y1)===lastKey || nodeKeyStr(l.x2,l.y2)===lastKey));
    if(!next) return null;
    used.add(next.id);
    path.push(nodeKeyStr(next.x1,next.y1)===lastKey ? nodeKeyStr(next.x2,next.y2) : nodeKeyStr(next.x1,next.y1));

function polygonPerimeterLogical(points){

      else if(st.type==='text'){ ctx.font='bold 15px sans-serif'; const w=ctx.measureText(st.text).width; ctx.fillRect(st.x-4, st.y-16, w+8, 20); }
      else if(st.type==='door'){ ctx.beginPath(); ctx.arc(st.x, st.y, 14, 0, Math.PI*2); ctx.fill(); }
      else if(st.type==='window'){ ctx.beginPath(); ctx.arc(st.x, st.y, 14, 0, Math.PI*2); ctx.fill(); }

    if(st.type==='line'){

      if(s.showMeasurements && st.manualLength!=null){
        const realLenInches = st.manualLength;
        const displayLen = realLenInches / unitInfo.toInches;
        const midX=(st.x1+st.x2)/2, midY=(st.y1+st.y2)/2;
        const label = displayLen.toFixed(1)+' '+unitInfo.label;
        ctx.font='bold 13px monospace';
        const w = ctx.measureText(label).width;
        ctx.fillStyle = '#fff'; ctx.fillRect(midX-w/2-3, midY-16, w+6, 16);
        ctx.fillStyle = st.color; ctx.fillText(label, midX-w/2, midY-4);
      }
    } else if(st.type==='free'){
      ctx.lineWidth = 2.4;
      ctx.beginPath();

      ctx.stroke();
    } else if(st.type==='text'){
      ctx.font = 'bold 15px sans-serif';
      ctx.fillStyle = st.color;
      ctx.fillText(st.text, st.x, st.y);
    } else if(st.type==='door'){
      const w = doorLogicalWidth(st, s);
      const dx = Math.cos(st.angle), dy = Math.sin(st.angle);
      const px = -dy, py = dx;
      const side = st.swingDirection==='out' ? -1 : 1;
      const p1x = st.x - dx*w/2, p1y = st.y - dy*w/2;
      const p2x = st.x + dx*w/2, p2y = st.y + dy*w/2;

      ctx.strokeStyle = '#fff'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(p1x,p1y); ctx.lineTo(p2x,p2y); ctx.stroke();
      ctx.restore();

        ctx.arc(p1x,p1y, w/2, Math.atan2(st.y-p1y,st.x-p1x), Math.atan2(openAy-p1y,openAx-p1x), side<0);
        ctx.stroke(); ctx.setLineDash([]);
        const openBx = p2x + px*side*(w/2), openBy = p2y + py*side*(w/2);
        ctx.beginPath(); ctx.moveTo(p2x,p2y); ctx.lineTo(openBx,openBy); ctx.stroke();
        ctx.setLineDash([3,3]); ctx.beginPath();
        ctx.arc(p2x,p2y, w/2, Math.atan2(st.y-p2y,st.x-p2x), Math.atan2(openBy-p2y,openBx-p2x), side>0);

      } else {
        const hingeX = st.hingeSide==='right' ? p2x : p1x, hingeY = st.hingeSide==='right' ? p2y : p1y;
        const wallEndX = st.hingeSide==='right' ? p1x : p2x, wallEndY = st.hingeSide==='right' ? p1y : p2y;
        const openX = hingeX + px*side*w, openY = hingeY + py*side*w;
        ctx.beginPath(); ctx.moveTo(hingeX,hingeY); ctx.lineTo(openX,openY); ctx.stroke();

      const p2x = st.x + dx*w/2, p2y = st.y + dy*w/2;
      ctx.save();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(p1x,p1y); ctx.lineTo(p2x,p2y); ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.strokeStyle = st.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p1x,p1y); ctx.lineTo(p2x,p2y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p1x-px*4,p1y-py*4); ctx.lineTo(p1x+px*4,p1y+py*4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p2x-px*4,p2y-py*4); ctx.lineTo(p2x+px*4,p2y+py*4); ctx.stroke();

    const pv = sketchDragState.preview;

    ctx.beginPath(); ctx.moveTo(pv.x1,pv.y1); ctx.lineTo(pv.x2,pv.y2); ctx.stroke();
    ctx.setLineDash([]);

    const unitInfo = SKETCH_UNITS[s.unit] || SKETCH_UNITS.ft;
    const pxLen = Math.hypot(pv.x2-pv.x1, pv.y2-pv.y1);
    let label = Math.round(angleDeg)+'°';
    if(s.calibScale) label += '  ·  ' + ((pxLen*s.calibScale)/unitInfo.toInches).toFixed(1) + ' ' + unitInfo.label;
    ctx.font = 'bold 13px monospace';
    const w = ctx.measureText(label).width;
    const lx = pv.x2 + 12, ly = pv.y2 - 12;
    ctx.fillStyle = '#2A261E'; ctx.fillRect(lx-4, ly-15, w+8, 20);
    ctx.fillStyle = '#fff'; ctx.fillText(label, lx, ly);
  }
  if(sketchDragState && sketchDragState.type==='free' && sketchDragState.points){
    ctx.strokeStyle = s.color; ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    sketchDragState.points.forEach((p,i)=>{ if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
    ctx.stroke();
  }
  if(sketchDragState && sketchDragState.type==='select' && sketchDragState.preview){
    const r = sketchDragState.preview;
    ctx.save();
    ctx.strokeStyle = '#2E5C8A'; ctx.fillStyle = 'rgba(46,92,138,0.12)'; ctx.lineWidth = 1.5; ctx.setLineDash([5,4]);
    ctx.fillRect(r.x1, r.y1, r.x2-r.x1, r.y2-r.y1);
    ctx.strokeRect(r.x1, r.y1, r.x2-r.x1, r.y2-r.y1);
    ctx.restore();

function sketchPointerDown(e, canvas){
  e.preventDefault();
  const s = STATE.sketchEditor;
  const pos = sketchPointerPos(e, canvas);
  if(s.mode==='text'){
    const hitText = findTextNear(pos.x, pos.y);
    if(hitText){
      sketchDragState = { type:'move-text', target: hitText, rawStartX:pos.x, rawStartY:pos.y, downTime:Date.now(), origX:hitText.x, origY:hitText.y };
    } else {
      sketchDragState = { type:'place-text-pending', rawStartX:pos.x, rawStartY:pos.y, downTime:Date.now() };
    }
    return;
  }
  if(s.mode==='select'){
    sketchDragState = { type:'select', rawStartX:pos.x, rawStartY:pos.y, startX:pos.x, startY:pos.y, downTime:Date.now(), preview:null };
    return;
  }
  if(s.mode==='edit'){
    const hitLine = findLineNear(pos.x, pos.y);
    if(hitLine){ promptCalibrateLine(hitLine); return; }
    const hitText = findTextNear(pos.x, pos.y);
    if(hitText){ promptEditText(hitText); return; }
    const hitDoor = findDoorNear(pos.x, pos.y);
    if(hitDoor){ showDoorEditPopup(hitDoor); return; }
    const hitWindow = findWindowNear(pos.x, pos.y);
    if(hitWindow){ promptEditWindow(hitWindow); return; }
    const roomHit = findRoomContaining(pos.x, pos.y);
    if(roomHit){ showRoomEditPopup(roomHit); return; }
    return;
  }
  if(s.mode==='door'){
    const hitDoor = findDoorNear(pos.x, pos.y);
    if(hitDoor){ showDoorEditPopup(hitDoor); return; }
    const wallLine = findLineNear(pos.x, pos.y);
    if(!wallLine){ alert('Tap near a wall to place a door.'); return; }
    promptNewDoor(pos.x, pos.y, wallLine);
    return;
  }
  if(s.mode==='window'){
    const hitWindow = findWindowNear(pos.x, pos.y);
    if(hitWindow){ promptEditWindow(hitWindow); return; }
    const wallLine = findLineNear(pos.x, pos.y);
    if(!wallLine){ alert('Tap near a wall to place a window.'); return; }
    promptNewWindow(pos.x, pos.y, wallLine);
    return;
  }
  if(s.mode==='line'){
    const start = resolveSnapPoint(pos.x, pos.y);
    sketchDragState = { type:'line', rawStartX:pos.x, rawStartY:pos.y, startX:start.x, startY:start.y, downTime:Date.now(), preview:{x1:start.x,y1:start.y,x2:start.x,y2:start.y} };
  } else {
    sketchDragState = { type:'free', points:[pos] };
  }
}
function sketchPointerMove(e, canvas){
  if(!sketchDragState) return;
  e.preventDefault();
  const s = STATE.sketchEditor;
  const pos = sketchPointerPos(e, canvas);
  if(sketchDragState.type==='line'){
    const magnetHit = s.magnetOn ? findNearestEndpoint(pos.x, pos.y, 20) : null;
    const endPoint = magnetHit ? magnetHit : snapAngle(sketchDragState.startX, sketchDragState.startY, pos.x, pos.y);
    sketchDragState.preview = { x1: sketchDragState.startX, y1: sketchDragState.startY, x2: endPoint.x, y2: endPoint.y };
  } else if(sketchDragState.type==='select'){
    sketchDragState.preview = normalizeRect(sketchDragState.startX, sketchDragState.startY, pos.x, pos.y);
  } else if(sketchDragState.type==='move-text'){
    sketchDragState.target.x = sketchDragState.origX + (pos.x - sketchDragState.rawStartX);
    sketchDragState.target.y = sketchDragState.origY + (pos.y - sketchDragState.rawStartY);
  } else if(sketchDragState.type==='place-text-pending'){
    return; // no visual feedback needed until we know it's a real tap vs a drag
  } else { sketchDragState.points.push(pos); }
  drawSketch(canvas.getContext('2d'), s);
}
function sketchPointerUp(e, canvas){
  if(!sketchDragState) return;
  const s = STATE.sketchEditor;
  const pos = sketchPointerPos(e, canvas);
  const dragDist = (sketchDragState.type==='line' || sketchDragState.type==='select' || sketchDragState.type==='move-text' || sketchDragState.type==='place-text-pending')
    ? Math.hypot(pos.x-sketchDragState.rawStartX, pos.y-sketchDragState.rawStartY) : 999;
  const wasTap = dragDist < 5 && (Date.now()-sketchDragState.downTime) < 500;
  if(sketchDragState.type==='line' && wasTap){
    const hit = findLineNear(pos.x, pos.y);
    sketchDragState = null;
    if(hit) promptCalibrateLine(hit);
    else drawSketch(canvas.getContext('2d'), s);
    return;
  }
  if(sketchDragState.type==='move-text'){
    const target = sketchDragState.target;
    if(wasTap){
      target.x = sketchDragState.origX; target.y = sketchDragState.origY; // revert tiny jitter
      sketchDragState = null;
      promptEditText(target);
    } else {
      sketchDragState = null;
      drawSketch(canvas.getContext('2d'), s);
    }
    return;
  }
  if(sketchDragState.type==='place-text-pending'){
    sketchDragState = null;
    if(wasTap) promptNewText(pos.x, pos.y);
    return;
  }
  if(sketchDragState.type==='select'){
    if(wasTap){
      const hit = findAnyStrokeNear(pos.x, pos.y);
      if(hit){ if(s.selectedIds.has(hit.id)) s.selectedIds.delete(hit.id); else s.selectedIds.add(hit.id); }
      else {
        const roomHit = findRoomContaining(pos.x, pos.y);
        if(roomHit){
          if(!roomHit.name){
            const pts = (roomHit.nodeKeys||[]).map(nodeKeyToPoint);
            const cx = pts.reduce((sum,p)=>sum+p.x,0)/pts.length, cy = pts.reduce((sum,p)=>sum+p.y,0)/pts.length;
            showInlinePopup(cx, cy, { title:'Name This Room', placeholder:'e.g. Kitchen', defaultValue:'', onSubmit:(val)=>{ if(val){ roomHit.name=val; renderSketchOverlay(); } } });
          } else {
            showRoomInfoPopup(roomHit);
          }
        }
      }
    } else {
      const rect = normalizeRect(sketchDragState.startX, sketchDragState.startY, pos.x, pos.y);
      s.strokes.forEach(st=>{ if(strokeIntersectsRect(st, rect)) s.selectedIds.add(st.id); });
    }
    sketchDragState = null;
    renderSketchOverlay(); // refresh toolbar so the "Delete Selected (N)" count updates
    return;
  }
  if(sketchDragState.type==='line'){
    const x1 = sketchDragState.startX, y1 = sketchDragState.startY;
    const magnetHit = s.magnetOn ? findNearestEndpoint(pos.x, pos.y, 20) : null;
    let x2, y2;
    if(magnetHit){ x2 = magnetHit.x; y2 = magnetHit.y; }
    else { const snappedEnd = snapAngle(x1, y1, pos.x, pos.y); x2 = snapToGrid(snappedEnd.x); y2 = snapToGrid(snappedEnd.y); }
    if(Math.hypot(x2-x1,y2-y1) > 4){ s.strokes.push({ id: uid(), type:'line', x1,y1,x2,y2, color:s.color, manualLength:null }); detectRooms(); }
  } else if(sketchDragState.type==='free'){
    if(sketchDragState.points.length>1) s.strokes.push({ id: uid(), type:'free', points: sketchDragState.points, color:s.color });
  }
  sketchDragState = null;
  drawSketch(canvas.getContext('2d'), s);
}
function promptNewText(x,y){
  const txt = prompt('Text label:', '');

  s.strokes.push({ id: uid(), type:'text', x, y, text: txt, color: s.color });

function promptEditText(strokeObj){

function dragConnectedCorner(movingLineId, oldX, oldY, newX, newY){
  const s = STATE.sketchEditor;
  const oldKey = nodeKeyStr(Math.round(oldX), Math.round(oldY));
  s.strokes.forEach(other=>{
    if(other.id===movingLineId || other.type!=='line') return;
    let moved = false;
    if(nodeKeyStr(Math.round(other.x1),Math.round(other.y1))===oldKey){ other.x1=newX; other.y1=newY; moved=true; }
    if(nodeKeyStr(Math.round(other.x2),Math.round(other.y2))===oldKey){ other.x2=newX; other.y2=newY; moved=true; }
    // that wall's own stated length (if any) no longer matches its new visual size — clear it so it doesn't show a wrong label
    if(moved && other.manualLength!=null) other.manualLength = null;
  });
}

function applyLineGeometry(strokeObj, lenStr, chosenUnit, angleStr){

    const newX2 = strokeObj.x1 + Math.cos(angleRad)*pxLen;
    const newY2 = strokeObj.y1 + Math.sin(angleRad)*pxLen;
    dragConnectedCorner(strokeObj.id, oldX2, oldY2, newX2, newY2);
    strokeObj.x2 = newX2; strokeObj.y2 = newY2;
    strokeObj.manualLength = inches;
  } else {
    const targetPxLen = inches / s.calibScale;
    const newX2 = strokeObj.x1 + Math.cos(angleRad)*targetPxLen;
    const newY2 = strokeObj.y1 + Math.sin(angleRad)*targetPxLen;
    dragConnectedCorner(strokeObj.id, oldX2, oldY2, newX2, newY2);
    strokeObj.x2 = newX2; strokeObj.y2 = newY2;
    strokeObj.manualLength = inches;
  }
  detectRooms();
  renderSketchOverlay();
}
function attachSketchToolbarHandlers(){
  document.querySelectorAll('[data-sketch-action]').forEach(el=>{
    const isPicker = el.tagName==='SELECT' || (el.tagName==='INPUT' && el.type==='color');
    const eventName = isPicker ? 'change' : 'click';
    el.addEventListener(eventName, ()=>{
      const action = el.dataset.sketchAction;
      const s = STATE.sketchEditor;
      if(action==='mode-line'){ s.mode='line'; renderSketchOverlay(); }
      if(action==='mode-free'){ s.mode='free'; renderSketchOverlay(); }
      if(action==='mode-text'){ s.mode='text'; renderSketchOverlay(); }
      if(action==='mode-door'){ s.mode='door'; renderSketchOverlay(); }
      if(action==='mode-window'){ s.mode='window'; renderSketchOverlay(); }
      if(action==='mode-select'){ s.mode='select'; renderSketchOverlay(); }
      if(action==='mode-edit'){ s.mode='edit'; renderSketchOverlay(); }
      if(action==='delete-selected'){
        if(s.selectedIds.size>0){
          s.strokes = s.strokes.filter(st=>!s.selectedIds.has(st.id));
          s.selectedIds.clear();
          detectRooms();
          renderSketchOverlay();
        }
      }
      if(action==='clear-selection'){ s.selectedIds.clear(); renderSketchOverlay(); }
      if(action==='name-room'){
        const lineIds = [...s.selectedIds].filter(id => { const st=s.strokes.find(x=>x.id===id); return st && st.type==='line'; });
        if(lineIds.length<3){ alert('Select at least 3 connected walls to name a room.'); return; }
        const name = prompt('Name this room:', '');
        if(!name) return;
        const chain = chainLinesToPolygon(lineIds, s.strokes);
        if(!chain){ alert("Those walls don't form a closed loop, so I can't calculate its area — but you can still name it; area just won't show."); }
        const key = chain ? [...new Set(chain)].sort().join(',') : null;
        let room = key ? s.rooms.find(r=>[...new Set(r.nodeKeys)].sort().join(',')===key) : null;
        if(!room){
          room = { id: uid(), nodeKeys: chain || [], name: '', color: null };
          s.rooms.push(room);
        }
        room.name = name;
        renderSketchOverlay();
      }
      if(action==='set-color'){ s.color = el.dataset.color; renderSketchOverlay(); }
      if(action==='set-room-color'){ s.roomColor = el.value; renderSketchOverlay(); }
      if(action==='toggle-measurements'){ s.showMeasurements = !s.showMeasurements; renderSketchOverlay(); }
      if(action==='fill-remaining-measurements'){
        if(s.calibScale==null){ alert('Measure at least one line first (tap it) — that sets the scale everything else fills in from.'); return; }
        let filled = 0;
        s.strokes.forEach(st=>{
          if(st.type==='line' && st.manualLength==null){
            const pxLen = Math.hypot(st.x2-st.x1, st.y2-st.y1);
            st.manualLength = pxLen * s.calibScale;
            filled++;
          }
        });
        if(filled===0) alert('Every line already has a measurement.');
        renderSketchOverlay();
      }
      if(action==='switch-page'){ switchToSketchPage(el.dataset.page); }
      if(action==='add-page'){ addNewSketchPage(); }
      if(action==='rename-page'){ renameCurrentSketchPage(); }
      if(action==='delete-page'){ deleteCurrentSketchPage(); }
      if(action==='toggle-magnet'){ s.magnetOn = !s.magnetOn; renderSketchOverlay(); }
      if(action==='zoom-in'){ s.zoom = Math.min(3, s.zoom+0.25); renderSketchOverlay(); }
      if(action==='zoom-out'){ s.zoom = Math.max(0.5, s.zoom-0.25); renderSketchOverlay(); }
      if(action==='undo'){ s.strokes.pop(); detectRooms(); renderSketchOverlay(); }
      if(action==='clear-all'){ if(confirm('Clear the entire sketch?')){ s.strokes=[]; s.calibScale=null; s.rooms=[]; renderSketchOverlay(); } }
      if(action==='close-sketch'){ if(s.readOnly || confirm('Close without saving? Any changes will be lost.')) closeSketchEditor(); }
      if(action==='save-sketch'){ saveSketchAndClose(); }
    });
  });
}
function saveSketchAndClose(){
  const s = STATE.sketchEditor;
  syncActivePageFromState();
  const canvas = document.getElementById('sketch-canvas');
  const snapshot = canvas.toDataURL('image/png'); // snapshot of whichever page was showing when Save was pressed
  const data = { pages: s.pages, activePageId: s.activePageId, snapshot };
  if(s.onSave) s.onSave(data);
  closeSketchEditor();
}

function inlineFormat(text){
  // escape first (so users can't inject HTML), then restore **bold** markers as <b> tags
  return esc(text).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
function parseLiteMarkup(src){
  const lines = (src||'').split('\n');
  let html = '';
  let listBuffer = [];
  function flushList(){
    if(listBuffer.length){ html += '<ul>' + listBuffer.map(li=>`<li>${inlineFormat(li)}</li>`).join('') + '</ul>'; listBuffer = []; }
  }
  lines.forEach(line=>{
    const trimmed = line.trim();
    if(trimmed===''){ flushList(); return; }
    if(trimmed.startsWith('## ')){ flushList(); html += `<h4>${inlineFormat(trimmed.slice(3).trim())}</h4>`; return; }
    if(trimmed.startsWith('- ')){ listBuffer.push(trimmed.slice(2).trim()); return; }
    flushList();
    html += `<p>${inlineFormat(trimmed)}</p>`;
  });
  flushList();
  return html;
}

function sortVendors(vendors){
  return [...vendors].sort((a,b)=>{
    if(!!b.favorite - !!a.favorite !== 0) return (!!b.favorite) - (!!a.favorite);
    if(!!b.trusted - !!a.trusted !== 0) return (!!b.trusted) - (!!a.trusted);
    if((b.rating||0) - (a.rating||0) !== 0) return (b.rating||0) - (a.rating||0);
    return a.name.localeCompare(b.name);
  });
}

/* ================= PRICING CALCULATOR ================= */
function calcMaterialsSubtotal(pb){
  return (pb.materialLines||[]).reduce((sum,line)=>{
    return sum + (parseFloat(line.unitPrice)||0) * (parseFloat(line.qty)||0);
  }, 0);
}
function calcSubsSubtotal(pb){
  return (pb.subLines||[]).reduce((sum,line)=> sum + (parseFloat(line.price)||0), 0);
}
function calcVendorsSubtotal(pb){
  return (pb.vendorLines||[]).reduce((sum,line)=> sum + (parseFloat(line.price)||0), 0);
}
function calcPricingTotals(pb){
  const materialsBase = calcMaterialsSubtotal(pb);
  const materialsWithMarkup = materialsBase * (1 + (parseFloat(pb.materialsMarkupPct)||0)/100);
  const laborTotal = (parseFloat(pb.laborRate)||0) * (parseFloat(pb.laborHours)||0);
  const subsBase = calcSubsSubtotal(pb);
  const subsWithMarkup = subsBase * (1 + (parseFloat(pb.subsMarkupPct)||0)/100);
  const vendorsBase = calcVendorsSubtotal(pb);
  const vendorsWithMarkup = vendorsBase * (1 + (parseFloat(pb.vendorsMarkupPct)||0)/100);
  const preTax = materialsWithMarkup + laborTotal + subsWithMarkup + vendorsWithMarkup;
  const taxAmount = preTax * (parseFloat(pb.taxPct)||0)/100;
  const grandTotal = preTax + taxAmount;
  return { materialsBase, materialsWithMarkup, laborTotal, subsBase, subsWithMarkup, vendorsBase, vendorsWithMarkup, preTax, taxAmount, grandTotal };
}
function calcPricingTotalsByCategory(pb){
  const cats = { demo:0, construction:0, ep:0 };
  (pb.materialLines||[]).forEach(line=>{
    const cat = line.category || 'construction';
    const lineTotal = (parseFloat(line.unitPrice)||0)*(parseFloat(line.qty)||0);
    cats[cat] += lineTotal * (1 + (parseFloat(pb.materialsMarkupPct)||0)/100);
  });
  (pb.subLines||[]).forEach(line=>{
    const cat = line.category || 'construction';
    cats[cat] += (parseFloat(line.price)||0) * (1 + (parseFloat(pb.subsMarkupPct)||0)/100);
  });
  (pb.vendorLines||[]).forEach(line=>{
    const cat = line.category || 'construction';
    cats[cat] += (parseFloat(line.price)||0) * (1 + (parseFloat(pb.vendorsMarkupPct)||0)/100);
  });
  cats.construction += (parseFloat(pb.laborRate)||0) * (parseFloat(pb.laborHours)||0); // labor always counts as construction
  const taxMult = 1 + (parseFloat(pb.taxPct)||0)/100;
  return { demo: cats.demo*taxMult, construction: cats.construction*taxMult, ep: cats.ep*taxMult };
}
function defaultPricingBreakdown(){
  return { materialLines:[], materialsMarkupPct:0, laborRate:0, laborHours:0, subLines:[], subsMarkupPct:0, vendorLines:[], vendorsMarkupPct:0, taxPct:0 };
}
function refreshPricingCalculatorTotals(pb){
  const totals = calcPricingTotals(pb);
  const setText = (id, text)=>{ const el = document.getElementById(id); if(el) el.textContent = text; };
  (pb.materialLines||[]).forEach(line=>{
    const lineTotal = (parseFloat(line.unitPrice)||0)*(parseFloat(line.qty)||0);
    setText('pc-line-total-'+line.id, money(lineTotal));
  });
  setText('pc-materials-base', money(totals.materialsBase));
  setText('pc-materials-markup', money(totals.materialsWithMarkup));
  setText('pc-labor-total', money(totals.laborTotal));
  setText('pc-subs-base', money(totals.subsBase));
  setText('pc-subs-markup', money(totals.subsWithMarkup));
  setText('pc-vendors-base', money(totals.vendorsBase));
  setText('pc-vendors-markup', money(totals.vendorsWithMarkup));
  setText('pc-gt-materials', money(totals.materialsWithMarkup));
  setText('pc-gt-labor', money(totals.laborTotal));
  setText('pc-gt-subs', money(totals.subsWithMarkup));
  setText('pc-gt-vendors', money(totals.vendorsWithMarkup));
  setText('pc-gt-tax', money(totals.taxAmount));
  setText('pc-gt-total', money(totals.grandTotal));
}

/* ================= CLIENTS ================= */
function checkupStatus(project){
  if(!project.completed || !project.completedDate) return {hasCompleted:false};
  const dueDate = new Date(project.completedDate+'T00:00:00'); dueDate.setMonth(dueDate.getMonth()+6);
  const diffDays = Math.round((dueDate - new Date())/(1000*60*60*24));
  return {hasCompleted:true, dueDate:dueDate.toISOString().slice(0,10), daysLeft:diffDays, overdue: diffDays<=0};
}

      <button class="btn ghost small" data-action="trigger-pdf-upload" data-slot="${slot}">Upload a PDF Instead</button>
    </div>
  `;
}
const UPLOAD_MAX_BYTES = 700 * 1024; // ~700KB raw file — keeps the base64-encoded version safely under Firestore's 1MB per-document limit
function detectUploadFileType(file){
  const nameLower = file.name.toLowerCase();
  const isPdf = file.type === 'application/pdf' || nameLower.endsWith('.pdf');
  const isWord = file.type === 'application/msword' || file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' || nameLower.endsWith('.doc') || nameLower.endsWith('.docx');
  if(isPdf) return 'pdf';
  if(isWord) return 'word';
  return null;
}
function downloadDataUrl(dataUrl, fileName){
  const a = document.createElement('a');
  a.href = dataUrl; a.download = fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function uploadedDocPreviewHTML(slotSettings, heightPx){
  if(slotSettings.fileType==='word'){
    return `<div class="banner-note" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
      <span>📄 <b>${esc(slotSettings.fileName)}</b> — Word documents can't preview inline in the browser, but the file is stored and ready to view.</span>
      <button type="button" class="btn ghost small" data-action="download-uploaded-doc" data-slot="${slotSettings.id}">Download to View</button>
    </div>`;
  }
  return `<iframe src="${slotSettings.dataUrl}" style="width:100%;height:${heightPx}px;border:1px solid var(--line);border-radius:6px;"></iframe>`;
}
function attachLegalDocUploadInputs(){
  ['construction','sub','vendor','estimate'].forEach(slot=>{
    const btn = document.querySelector(`[data-action="trigger-pdf-upload"][data-slot="${slot}"]`);
    const input = document.getElementById('pdf-upload-'+slot);
    if(!btn || !input) return;
    btn.addEventListener('click', ()=> input.click());
    input.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const fileType = detectUploadFileType(file);
      if(!fileType){ alert('Please choose a PDF or Word document (.pdf, .doc, or .docx).'); input.value=''; return; }
      if(file.size > UPLOAD_MAX_BYTES){ alert(`That file is too large (${Math.round(file.size/1024)}KB). Please keep uploaded files under ${Math.round(UPLOAD_MAX_BYTES/1024)}KB — a plain text contract is usually well within that.`); input.value=''; return; }
      const reader = new FileReader();
      reader.onload = async ()=>{
        const record = { id:slot, mode:'pdf', fileType, fileName:file.name, dataUrl:reader.result, uploadedAt: nowISO() };
        const idx = DB.legalDocSettings.findIndex(s=>s.id===slot);
        if(idx>=0) DB.legalDocSettings[idx]=record; else DB.legalDocSettings.push(record);
        await saveRecord('legalDocSettings', record);
        render();
      };
      reader.readAsDataURL(file);
    });
  });
}

  return `
    <h1 class="page-title">Google Reviews</h1>

      <img src="${GOOGLE_REVIEW_QR}" alt="Scan to leave a Google review">

/* ================= CALENDAR ================= */
function renderCalendar(){
  const p = perms();
  const events = [...DB.calendarEvents].sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  const upcoming = events.filter(e=> e.date >= todayStr());
  const past = events.filter(e=> e.date < todayStr());
  return `
    <div class="section-head"><div><h1 class="page-title">Calendar</h1><div class="subtle" style="margin-bottom:0">Inspections, appointments, and job dates.</div></div>
      ${p.calendarManage ? `<button class="btn" data-action="add-calendar-event">+ Add Event</button>` : ''}</div>
    <div class="banner-note">This calendar lives inside the app for now. Once we're on the real backend build, it'll sync both ways with Google Calendar and your Wix booking form, so a time taken here blocks it on your website too.</div>
    <div class="section-label">Upcoming</div>
    <div class="card" style="padding:8px 20px;">
      ${upcoming.length===0 ? emptyState('Nothing scheduled yet','') : upcoming.map(e=>calendarEventRow(e,p)).join('')}
    </div>
    ${past.length>0 ? `
    <div class="section-label">Past</div>
    <div class="card" style="padding:8px 20px;">
      ${past.map(e=>calendarEventRow(e,p)).join('')}
    </div>` : ''}
  `;
}

/* ================= TODAY ================= */
function renderToday(){
  const p = perms();
  const filterId = STATE.todayFilter || STATE.user.id;
  const viewingTeam = DB.team.find(t=>t.id===filterId);
  const viewingLabel = filterId===STATE.user.id ? 'My Tasks' : (viewingTeam ? `${viewingTeam.first} ${viewingTeam.last}'s Tasks` : 'My Tasks');

  const mine = DB.calendarEvents.filter(e => (e.assignedTo||'') === filterId);
  const dueToday = mine.filter(e => e.date === todayStr() && !e.done).sort((a,b)=> (a.time||'').localeCompare(b.time||''));
  const overdue = mine.filter(e => e.date < todayStr() && !e.done).sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  const doneToday = mine.filter(e => e.date === todayStr() && e.done);

  return `
    <div class="section-head"><div><h1 class="page-title">Today</h1><div class="subtle" style="margin-bottom:0">${viewingLabel} — ${fmtDate(todayStr())}</div></div></div>
    ${p.viewAllTasks ? `
      <div class="field" style="max-width:280px;">
        <label>Viewing</label>
        <select id="today-filter-select">
          <option value="${STATE.user.id}" ${filterId===STATE.user.id?'selected':''}>My Tasks</option>
          ${DB.team.filter(t=>t.id!==STATE.user.id).map(t=>`<option value="${t.id}" ${filterId===t.id?'selected':''}>${esc(t.first)} ${esc(t.last)}</option>`).join('')}
        </select>
      </div>` : ''}
    ${overdue.length>0 ? `
    <div class="section-label">Overdue</div>
    <div class="card" style="padding:8px 20px;">
      ${overdue.map(e=>todayTaskRow(e)).join('')}
    </div>` : ''}
    <div class="section-label">Due Today</div>
    <div class="card" style="padding:8px 20px;">
      ${dueToday.length===0 ? emptyState('Nothing due today','') : dueToday.map(e=>todayTaskRow(e)).join('')}
    </div>
    ${doneToday.length>0 ? `
    <div class="section-label">Completed Today</div>
    <div class="card" style="padding:8px 20px;">
      ${doneToday.map(e=>todayTaskRow(e)).join('')}
    </div>` : ''}
  `;
}

    const newRole = { key, label, perms:{vendors:false, vendorsManage:false, vendorsAgreements:false, manageTeam:false, manageRoles:false, money:false, clients:false, projects:false, onsiteSubmit:false, onsiteReview:false, contractLock:false, stageToggle:false, notifications:true, calendar:true, calendarManage:false, canEmailClients:false, viewAllTasks:false, manageContractTemplates:false} };
    DB.roles.push(newRole);
    await saveRecord('roles', newRole); STATE.modal=null; render();
  });
  document.querySelectorAll('[data-action="del-role"]').forEach(el=>el.addEventListener('click', ()=>{
    if(DB.team.some(t=>t.role===el.dataset.key)){ alert('Someone on your team currently has this role — reassign them first.'); return; }
    const keyToDelete = el.dataset.key;
    DB.roles = DB.roles.filter(r=>r.key!==keyToDelete); deleteRecord('roles', keyToDelete); render();
  }));

  document.querySelectorAll('[data-action="open-legal-edit"]').forEach(el=>el.addEventListener('click', ()=>{
    const doc = getLegalDoc(el.dataset.id);
    STATE.modal = {type:'legal-doc-edit', data:doc}; render();
  }));
  bindClick('save-legal-doc', async (el)=>{
    const id = el.dataset.id;
    const content = val('legal-doc-content');
    const existing = getLegalDoc(id);
    const updated = { id, label: existing.label, content };
    const idx = DB.legalDocs.findIndex(d=>d.id===id);
    if(idx>=0) DB.legalDocs[idx]=updated; else DB.legalDocs.push(updated);
    await saveRecord('legalDocs', updated);
    STATE.modal=null; render();
    alert('Saved. This wording now applies to every new Estimate, Contract, and Agreement.');
  });
  document.querySelectorAll('[data-action="reset-legal-doc"]').forEach(el=>el.addEventListener('click', async ()=>{
    const id = el.dataset.id;
    if(!confirm('Reset this document back to its original default wording? Any edits you made will be lost.')) return;
    const fallback = DEFAULT_LEGAL_DOCS.find(d=>d.id===id);
    const restored = { id, label: fallback.label, content: fallback.content };
    const idx = DB.legalDocs.findIndex(d=>d.id===id);
    if(idx>=0) DB.legalDocs[idx]=restored; else DB.legalDocs.push(restored);
    await saveRecord('legalDocs', restored);
    STATE.modal = {type:'legal-doc-edit', data:restored}; render();
  }));

  document.querySelectorAll('[data-action="view-uploaded-pdf"]').forEach(el=>el.addEventListener('click', ()=>{
    const s = legalSlotSettings(el.dataset.slot);
    if(!s.dataUrl) return;
    if(s.fileType==='word'){ downloadDataUrl(s.dataUrl, s.fileName); return; }
    const w = window.open(); w.document.write(`<iframe src="${s.dataUrl}" style="border:none;width:100%;height:100vh;"></iframe>`);
  }));
  document.querySelectorAll('[data-action="download-uploaded-doc"]').forEach(el=>el.addEventListener('click', ()=>{
    const s = legalSlotSettings(el.dataset.slot);
    if(s.dataUrl) downloadDataUrl(s.dataUrl, s.fileName);
  }));
  document.querySelectorAll('[data-action="switch-legal-mode"]').forEach(el=>el.addEventListener('click', async ()=>{
    const slot = el.dataset.slot, mode = el.dataset.mode;
    const s = legalSlotSettings(slot);
    const updated = { ...s, mode };
    const idx = DB.legalDocSettings.findIndex(x=>x.id===slot);
    if(idx>=0) DB.legalDocSettings[idx]=updated; else DB.legalDocSettings.push(updated);
    await saveRecord('legalDocSettings', updated);
    render();
  }));

  bindClick('copy-review-link', (el)=>{
    navigator.clipboard.writeText(GOOGLE_REVIEW_LINK).then(()=>{ el.textContent='Copied!'; setTimeout(()=>{el.textContent='Copy Link';},1500); });
  });

  bindClick('add-calendar-event', ()=>{ STATE.modal = {type:'calendar-event-form', data:null}; render(); });
  document.querySelectorAll('[data-action="edit-calendar-event"]').forEach(el=>el.addEventListener('click', ()=>{
    const ev = DB.calendarEvents.find(x=>x.id===el.dataset.id);
    STATE.modal = {type:'calendar-event-form', data: ev}; render();
  }));
  document.querySelectorAll('[data-action="del-calendar-event"]').forEach(el=>el.addEventListener('click', ()=>{
    const idToDelete = el.dataset.id;
    DB.calendarEvents = DB.calendarEvents.filter(x=>x.id!==idToDelete); deleteRecord('calendarEvents', idToDelete); render();
  }));
  bindClick('save-calendar-event', async (el)=>{
    const title = val('ce-title'); if(!title){ alert('Title required.'); return; }
    const client = DB.clients.find(c=>c.id===val('ce-client'));
    const assignee = DB.team.find(t=>t.id===val('ce-assigned'));
    const id = el.dataset.id;
    const existing = DB.calendarEvents.find(x=>x.id===id);
    const obj = { id: id || uid(), title, date: val('ce-date'), time: val('ce-time'),
      clientId: client?client.id:'', clientName: client?client.name:'', note: val('ce-note'),
      assignedTo: assignee?assignee.id:'', assignedToName: assignee?(assignee.first+' '+assignee.last):'',
      done: existing ? !!existing.done : false, doneAt: existing ? (existing.doneAt||null) : null };
    const idx = DB.calendarEvents.findIndex(x=>x.id===id);
    if(idx>=0) DB.calendarEvents[idx]=obj; else DB.calendarEvents.push(obj);
    await saveRecord('calendarEvents', obj); STATE.modal=null; render();
  });

  document.querySelectorAll('[data-action="mark-task-done"]').forEach(el=>el.addEventListener('click', ()=>{
    const e = DB.calendarEvents.find(x=>x.id===el.dataset.id);
    e.done = true; e.doneAt = nowISO();
    saveRecord('calendarEvents', e); render();
  }));
  const todayFilterSelect = document.getElementById('today-filter-select');
  if(todayFilterSelect) todayFilterSelect.addEventListener('change', ()=>{
    STATE.todayFilter = todayFilterSelect.value; render();
  });
}
function bindClick(action, fn){ document.querySelectorAll(`[data-action="${action}"]`).forEach(el=>el.addEventListener('click', ()=>fn(el))); }

/* ================= AUTO CLIENT/PROJECT CREATION ================= */
async function ensureClientExists(name, phone){
  const normPhone = (p)=> (p||'').replace(/\D/g,'');
  const normName = (n)=> (n||'').trim().toLowerCase();
  const existing = DB.clients.find(c=> normName(c.name)===normName(name) && normPhone(c.primaryPhone)===normPhone(phone));
  if(existing) return existing;
  const client = { id:uid(), name, company:'', mailingAddress:'', propertyAddress:'',
    primaryPhone: phone, secondaryPhone:'', email:'', preferredContact:'Call', howHeard:'', referredBy:'',
    notes:'', projects:[] };
  DB.clients.push(client);
  await saveRecord('clients', client);
  return client;
}
async function autoCreateOrAttachClient(contract){
  const normPhone = (p)=> (p||'').replace(/\D/g,'');
  const normName = (n)=> (n||'').trim().toLowerCase();
  let client = DB.clients.find(c=> normName(c.name)===normName(contract.clientName) && normPhone(c.primaryPhone)===normPhone(contract.clientPhone));

  const project = { id:uid(), projectName: contract.clientName ? contract.clientName+' — Project' : '', date: todayStr(), description: contract.constr || contract.demo || 'New project', contractAmount: contract.pricing.total,
    estimateSigned:true, contractSigned:true, permitStatus:'not_required', constructionInProgress:false, completed:false, completedDate:null,
    checkupLetterSent:false, warrantyNotes:[], permits:[], inspections:[], beforePhotos:[], afterPhotos:[],
    onsiteId: contract.onsiteId||null, estimateId: contract.estimateId||null, contractId: contract.id };

  if(client){
    client.projects.push(project);
    pushNotification(`Contract signed — new project auto-added to existing client ${client.name}.`);
  } else {
    // pull intake info from linked onsite worksheet if available
    const onsite = contract.onsiteId ? DB.onsite.find(o=>o.id===contract.onsiteId) : null;
    client = { id:uid(), name: contract.clientName, company:'', mailingAddress: contract.address, propertyAddress: contract.address,
      primaryPhone: contract.clientPhone, secondaryPhone:'', email: contract.clientEmail, preferredContact:'Call', howHeard:'Referral', referredBy:'',
      notes: onsite ? ('Captured on-site: '+(onsite.followup||'')) : '', projects:[project] };
    DB.clients.push(client);
    pushNotification(`Contract signed — new client "${client.name}" auto-created with their first project.`);
  }
  await saveRecord('clients', client);

  // everything's now reachable from the project — clear the worksheet, estimate, and contract out of their working lists
  const linkedOnsite = contract.onsiteId ? DB.onsite.find(o=>o.id===contract.onsiteId) : null;
  if(linkedOnsite && !linkedOnsite.archived){ linkedOnsite.archived = true; await saveRecord('onsite', linkedOnsite); }
  const linkedEstimate = contract.estimateId ? DB.estimates.find(e=>e.id===contract.estimateId) : null;
  if(linkedEstimate && !linkedEstimate.archived){ linkedEstimate.archived = true; await saveRecord('estimates', linkedEstimate); }
  const liveContract = DB.contracts.find(x=>x.id===contract.id);
  if(liveContract && !liveContract.archived){ liveContract.archived = true; await saveRecord('contracts', liveContract); }
}
